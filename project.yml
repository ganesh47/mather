name: Mather
options:
  bundleIdPrefix: com.ganesh47
  deploymentTarget:
    iOS: "18.0"
    tvOS: "18.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    PRODUCT_NAME: Mather
    # Your Apple Developer Team ID — find it at:
    # developer.apple.com → Account → Membership → Team ID
    # Required for Xcode Cloud to analyze the project and manage signing.
    DEVELOPMENT_TEAM: "J3387FUR8X"
    CODE_SIGN_STYLE: Automatic
    # MARKETING_VERSION is overridden at release time by the release workflow
    # (.github/workflows/release.yml) from the git tag (e.g. v1.0.0 → 1.0.0).
    # Local development builds show 0.1.0-dev. See ADR-0003 for the scheme.
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0-dev
targets:
  Mather:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Domain
      - path: Features
      - path: Persistence
      # Directory source includes SmartPlayProvider.swift.
      - path: Services
        includes:
          - "**/*.swift"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ganesh47.Mather
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - MatherTests
        - MatherUITests
  MatherTV:
    type: application
    platform: tvOS
    sources:
      - path: AppTV
        includes:
          - "**/*.swift"
      - path: Domain/MemoryContent.swift
      - path: Domain/MemoryGalleryTVRound.swift
      - path: Domain/SumSprintPartyTVRound.swift
      - path: Domain/AngleArcadeModel.swift
      - path: App/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: MatherTV
        PRODUCT_BUNDLE_IDENTIFIER: com.ganesh47.Mather
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Mather TV
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TVOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: MatherTVAppIcon
    scheme: {}
  MatherUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/MatherUITests
    dependencies:
      - target: Mather
    settings:
      base:
        PRODUCT_NAME: MatherUITests
        PRODUCT_MODULE_NAME: MatherUITests
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ganesh47.MatherUITests
        TEST_TARGET_NAME: Mather
  MatherTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      # Directory source includes SmartPlayProviderTests.swift.
      - path: Tests/MatherTests
        includes:
          - "**/*.swift"
    dependencies:
      - target: Mather
    settings:
      base:
        PRODUCT_NAME: MatherTests
        PRODUCT_MODULE_NAME: MatherTests
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ganesh47.MatherTests
