name: Poll v0.1.11 Build Status
on:
  workflow_dispatch:
    inputs:
      target_version:
        default: "0.1.11"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - run: pip3 install -r ci_scripts/testflight-feedback-requirements.txt
      - name: Poll until v0.1.11 build lands in TestFlight
        env:
          APP_STORE_CONNECT_APP_ID: ${{ secrets.APP_STORE_CONNECT_APP_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          for i in $(seq 1 12); do
            echo "=== Poll attempt $i / 12 ($(date -u)) ==="
            python3 ci_scripts/check_build_status.py && exit 0
            echo "Not yet — waiting 5 min..."
            sleep 300
          done
          echo "Timed out after 60 min waiting for build."
          exit 1
