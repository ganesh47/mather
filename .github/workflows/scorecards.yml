name: Scorecards

on:
  branch_protection_rule:
  schedule:
    - cron: "25 17 * * 1"
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  scorecard:
    name: OSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
