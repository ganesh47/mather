name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Choose simulator destination
        run: |
          set -euo pipefail
          for name in "iPhone 17" "iPhone 17 Pro" "iPhone 16" "iPhone 15"; do
            line="$(xcrun simctl list devices available | grep -F "$name (" | head -n 1 || true)"
            if [[ -n "$line" ]]; then
              id="$(sed -E "s/.*\(([A-F0-9-]+)\).*/\1/" <<<"$line")"
              echo "SIM_DESTINATION=id=$id" >> "$GITHUB_ENV"
              echo "Using simulator: $name ($id)"
              exit 0
            fi
          done
          echo "No preferred iPhone simulator found" >&2
          xcrun simctl list devices available
          exit 1

      - name: Resolve dependencies
        run: xcodebuild -project Mather.xcodeproj -resolvePackageDependencies -scheme Mather

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project Mather.xcodeproj \
            -scheme Mather \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO

      - name: Boot simulator
        run: |
          # Extract raw UUID from SIM_DESTINATION (format: id=<UUID>)
          SIM_ID="${SIM_DESTINATION#id=}"
          STATE=$(xcrun simctl list devices | grep "$SIM_ID" | grep -oE 'Booted|Shutdown' || echo "Unknown")
          if [[ "$STATE" != "Booted" ]]; then
            echo "Booting simulator $SIM_ID…"
            xcrun simctl boot "$SIM_ID"
          fi
          # Wait until fully booted
          xcrun simctl bootstatus "$SIM_ID" -b
          echo "Simulator ready: $SIM_ID"

      - name: Run unit tests
        timeout-minutes: 10
        run: |
          xcodebuild test-without-building \
            -project Mather.xcodeproj \
            -scheme Mather \
            -destination "$SIM_DESTINATION" \
            -only-testing MatherTests \
            -skip-testing MatherUITests \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Run UI screenshot tests
        timeout-minutes: 15
        run: |
          xcodebuild test-without-building \
            -project Mather.xcodeproj \
            -scheme Mather \
            -destination "$SIM_DESTINATION" \
            -only-testing MatherUITests \
            -resultBundlePath UITestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Extract screenshots from result bundle
        if: always()
        run: |
          mkdir -p ci-screenshots

          # Write the extraction script to a file to avoid pipe+heredoc conflicts (SC2259)
          cat > /tmp/extract_screenshots.py << 'PYEOF'
          import sys, json, subprocess, pathlib

          data = json.load(sys.stdin)
          out = pathlib.Path("ci-screenshots")
          out.mkdir(exist_ok=True)

          def walk(node):
              if isinstance(node, dict):
                  if node.get("_type", {}).get("_name") == "ActionTestAttachment":
                      name   = node.get("name", {}).get("_value", "screenshot")
                      ref_id = (node.get("payloadRef") or {}).get("id", {}).get("_value")
                      if ref_id:
                          dest = out / f"{name}.png"
                          subprocess.run(
                              ["xcrun", "xcresulttool", "export",
                               "--path", "UITestResults.xcresult",
                               "--id", ref_id,
                               "--output-path", str(dest)],
                              check=False, capture_output=True,
                          )
                          if dest.exists():
                              print(f"  saved {dest}")
                  for v in node.values():
                      walk(v)
              elif isinstance(node, list):
                  for item in node:
                      walk(item)

          walk(data)
          PYEOF

          if [[ -d UITestResults.xcresult ]]; then
            xcrun xcresulttool get \
              --path UITestResults.xcresult \
              --format json 2>/dev/null \
            | python3 /tmp/extract_screenshots.py
          fi

          # Capture a live simulator screenshot as a final-state sanity image
          SIM_ID=$(xcrun simctl list devices booted \
            | grep -E '\([-A-F0-9]+\)' | head -1 \
            | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          if [[ -n "$SIM_ID" ]]; then
            xcrun simctl io "$SIM_ID" screenshot \
              ci-screenshots/simulator-final-state.png 2>/dev/null || true
          fi

          echo "--- Screenshot artifacts ---"
          find ci-screenshots -name "*.png" | sort | while read -r f; do
            SIZE=$(wc -c < "$f")
            echo "  $f (${SIZE} bytes)"
          done || echo "  (none)"

      - name: Upload test result bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: |
            TestResults.xcresult
            UITestResults.xcresult
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: ci-screenshots/
          if-no-files-found: ignore
          retention-days: 30
