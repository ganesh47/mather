name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Test TestFlight release helper
        run: |
          python3 -m venv .venv-testflight
          .venv-testflight/bin/pip install -r ci_scripts/testflight-feedback-requirements.txt
          .venv-testflight/bin/python -m unittest ci_scripts/test_xcode_cloud_testflight.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Verify generated project is committed
        run: git diff --exit-code Mather.xcodeproj

      - name: Build tvOS app
        run: |
          xcodebuild build \
            -project Mather.xcodeproj \
            -scheme MatherTV \
            -destination "generic/platform=tvOS Simulator" \
            CODE_SIGNING_ALLOWED=NO

      - name: Choose simulator destination
        run: |
          set -euo pipefail
          # Prefer stable iOS 18.x simulators — iPhone 17 only exists on iOS 26 (beta)
          # which hangs under test. Favour iPhone 16/15 on iOS 18 instead.
          for name in "iPhone 16 Pro" "iPhone 16" "iPhone 15 Pro" "iPhone 15"; do
            line="$(xcrun simctl list devices available | grep -F "$name (" | grep -v "26\." | head -n 1 || true)"
            if [[ -n "$line" ]]; then
              id="$(sed -E "s/.*\(([A-F0-9-]+)\).*/\1/" <<<"$line")"
              echo "SIM_DESTINATION=id=$id" >> "$GITHUB_ENV"
              echo "Using simulator: $name ($id)"
              exit 0
            fi
          done
          # Fallback: any available iPhone simulator (beta OS acceptable as last resort)
          for name in "iPhone 16 Pro" "iPhone 16" "iPhone 15" "iPhone 17"; do
            line="$(xcrun simctl list devices available | grep -F "$name (" | head -n 1 || true)"
            if [[ -n "$line" ]]; then
              id="$(sed -E "s/.*\(([A-F0-9-]+)\).*/\1/" <<<"$line")"
              echo "SIM_DESTINATION=id=$id" >> "$GITHUB_ENV"
              echo "Using simulator (fallback): $name ($id)"
              exit 0
            fi
          done
          echo "No preferred iPhone simulator found" >&2
          xcrun simctl list devices available
          exit 1

      - name: Resolve dependencies
        run: xcodebuild -project Mather.xcodeproj -resolvePackageDependencies -scheme Mather

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project Mather.xcodeproj \
            -scheme Mather \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO

      - name: Boot simulator
        timeout-minutes: 8
        run: |
          SIM_ID="${SIM_DESTINATION#id=}"
          # boot returns exit 164 ("already booted") — ignore it
          xcrun simctl boot "$SIM_ID" 2>/dev/null || true
          # Poll for Booted state (bootstatus -b can hang indefinitely)
          for i in $(seq 1 40); do
            STATE=$(xcrun simctl list devices | grep -F "$SIM_ID" \
              | grep -oE 'Booted|Shutdown|Booting' | head -1 || echo "Unknown")
            echo "[$i/40] $STATE"
            [[ "$STATE" == "Booted" ]] && {
              echo "Simulator booted: $SIM_ID"
              # Wait for SpringBoard to finish initialising before handing off to
              # xcodebuild — the OS reports Booted before the UI is fully ready,
              # which causes the first test run to hang waiting for the app to launch.
              sleep 10
              exit 0
            }
            sleep 5
          done
          echo "Simulator did not reach Booted state after 200s" >&2
          xcrun simctl list devices | grep -F "$SIM_ID" >&2
          exit 1

      - name: Run unit tests
        timeout-minutes: 20
        run: |
          xcodebuild test-without-building \
            -project Mather.xcodeproj \
            -scheme Mather \
            -destination "$SIM_DESTINATION" \
            -only-testing MatherTests \
            -skip-testing MatherUITests \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload unit test result bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unit-test-results-${{ github.run_number }}
          path: TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 30
