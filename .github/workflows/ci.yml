name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Choose simulator destination
        run: |
          set -euo pipefail
          for name in "iPhone 17" "iPhone 17 Pro" "iPhone 16" "iPhone 15"; do
            line="$(xcrun simctl list devices available | grep -F "$name (" | head -n 1 || true)"
            if [[ -n "$line" ]]; then
              id="$(sed -E "s/.*\(([A-F0-9-]+)\).*/\1/" <<<"$line")"
              echo "SIM_DESTINATION=id=$id" >> "$GITHUB_ENV"
              echo "Using simulator: $name ($id)"
              exit 0
            fi
          done
          echo "No preferred iPhone simulator found" >&2
          xcrun simctl list devices available
          exit 1

      - name: Resolve dependencies
        run: xcodebuild -project Mather.xcodeproj -resolvePackageDependencies -scheme Mather

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project Mather.xcodeproj \
            -scheme Mather \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO

      - name: Boot simulator
        timeout-minutes: 8
        run: |
          SIM_ID="${SIM_DESTINATION#id=}"
          # boot returns exit 164 ("already booted") — ignore it
          xcrun simctl boot "$SIM_ID" 2>/dev/null || true
          # Poll for Booted state (bootstatus -b can hang indefinitely)
          for i in $(seq 1 40); do
            STATE=$(xcrun simctl list devices | grep -F "$SIM_ID" \
              | grep -oE 'Booted|Shutdown|Booting' | head -1 || echo "Unknown")
            echo "[$i/40] $STATE"
            [[ "$STATE" == "Booted" ]] && { echo "Simulator ready: $SIM_ID"; exit 0; }
            sleep 5
          done
          echo "Simulator did not reach Booted state after 200s" >&2
          xcrun simctl list devices | grep -F "$SIM_ID" >&2
          exit 1

      - name: Run unit tests
        timeout-minutes: 10
        run: |
          xcodebuild test-without-building \
            -project Mather.xcodeproj \
            -scheme Mather \
            -destination "$SIM_DESTINATION" \
            -only-testing MatherTests \
            -skip-testing MatherUITests \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Run UI screenshot tests
        timeout-minutes: 15
        run: |
          xcodebuild test-without-building \
            -project Mather.xcodeproj \
            -scheme Mather \
            -destination "$SIM_DESTINATION" \
            -only-testing MatherUITests \
            -resultBundlePath UITestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Extract screenshots from result bundle
        if: always()
        continue-on-error: true
        run: |
          mkdir -p ci-screenshots

          # Xcode 16.4: xcresulttool get --format json returns empty without --legacy.
          # Strategy 1: --legacy flag restores the old _type JSON structure.
          # Strategy 2: xcresult bundles are directories — copy PNGs from Attachments/.
          cat > /tmp/extract_screenshots.py << 'PYEOF'
          import sys, json, subprocess, pathlib, shutil

          bundle = pathlib.Path("UITestResults.xcresult")
          out    = pathlib.Path("ci-screenshots")
          out.mkdir(exist_ok=True)

          if not bundle.exists():
              print("No UITestResults.xcresult — skipping")
              sys.exit(0)

          # Try --legacy first (Xcode 16+ flag that restores _type JSON format),
          # then without it for older Xcode versions.
          raw = ""
          for extra in [["--legacy"], []]:
              cmd = ["xcrun", "xcresulttool", "get",
                     "--path", str(bundle), "--format", "json"] + extra
              res = subprocess.run(cmd, capture_output=True, text=True)
              raw = res.stdout.strip()
              if raw:
                  flag = "--legacy" if extra else "no flags"
                  print(f"xcresulttool returned JSON ({flag})")
                  break

          if raw:
              data = json.loads(raw)

              def walk(node):
                  if isinstance(node, dict):
                      if node.get("_type", {}).get("_name") == "ActionTestAttachment":
                          name   = node.get("name", {}).get("_value", "screenshot")
                          ref_id = (node.get("payloadRef") or {}).get("id", {}).get("_value")
                          if ref_id:
                              dest = out / f"{name}.png"
                              subprocess.run(
                                  ["xcrun", "xcresulttool", "export",
                                   "--path", str(bundle),
                                   "--id", ref_id,
                                   "--output-path", str(dest)],
                                  check=False, capture_output=True,
                              )
                              if dest.exists():
                                  print(f"  saved {dest}")
                      for v in node.values():
                          walk(v)
                  elif isinstance(node, list):
                      for item in node:
                          walk(item)

              walk(data)
              extracted = list(out.glob("*.png"))
              print(f"  {len(extracted)} named screenshot(s) extracted via xcresulttool")
          else:
              # Fallback: xcresult is a directory — grab PNG attachments directly.
              print("xcresulttool returned empty — copying PNGs from bundle directory")
              found = 0
              for png in bundle.rglob("*.png"):
                  dest = out / f"attachment-{found:02d}-{png.stem[:12]}.png"
                  shutil.copy(png, dest)
                  print(f"  copied {png.name} → {dest.name}")
                  found += 1
              if found == 0:
                  print("  no PNG attachments found in bundle")
          PYEOF

          python3 /tmp/extract_screenshots.py

          # Always capture a live simulator screenshot as a visual sanity check
          SIM_ID=$(xcrun simctl list devices booted \
            | grep -E '\([-A-F0-9]+\)' | head -1 \
            | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          if [[ -n "$SIM_ID" ]]; then
            xcrun simctl io "$SIM_ID" screenshot \
              ci-screenshots/simulator-final-state.png 2>/dev/null || true
          fi

          echo "--- Screenshot artifacts ---"
          find ci-screenshots -name "*.png" | sort | while read -r f; do
            SIZE=$(wc -c < "$f")
            echo "  $f (${SIZE} bytes)"
          done || echo "  (none)"

      - name: Upload test result bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: |
            TestResults.xcresult
            UITestResults.xcresult
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: ci-screenshots/
          if-no-files-found: ignore
          retention-days: 30
