name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Choose simulator destination
        run: |
          set -euo pipefail
          for name in "iPhone 17" "iPhone 17 Pro" "iPhone 16" "iPhone 15"; do
            line="$(xcrun simctl list devices available | grep -F "$name (" | head -n 1 || true)"
            if [[ -n "$line" ]]; then
              id="$(sed -E "s/.*\(([A-F0-9-]+)\).*/\1/" <<<"$line")"
              echo "SIM_DESTINATION=id=$id" >> "$GITHUB_ENV"
              echo "Using simulator: $name ($id)"
              exit 0
            fi
          done
          echo "No preferred iPhone simulator found" >&2
          xcrun simctl list devices available
          exit 1

      - name: Resolve dependencies
        run: xcodebuild -project Mather.xcodeproj -resolvePackageDependencies -scheme Mather

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project Mather.xcodeproj \
            -scheme Mather \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO

      - name: Boot simulator
        timeout-minutes: 8
        run: |
          SIM_ID="${SIM_DESTINATION#id=}"
          # boot returns exit 164 ("already booted") — ignore it
          xcrun simctl boot "$SIM_ID" 2>/dev/null || true
          # Poll for Booted state (bootstatus -b can hang indefinitely)
          for i in $(seq 1 40); do
            STATE=$(xcrun simctl list devices | grep -F "$SIM_ID" \
              | grep -oE 'Booted|Shutdown|Booting' | head -1 || echo "Unknown")
            echo "[$i/40] $STATE"
            [[ "$STATE" == "Booted" ]] && { echo "Simulator ready: $SIM_ID"; exit 0; }
            sleep 5
          done
          echo "Simulator did not reach Booted state after 200s" >&2
          xcrun simctl list devices | grep -F "$SIM_ID" >&2
          exit 1

      - name: Run unit tests
        timeout-minutes: 10
        run: |
          xcodebuild test-without-building \
            -project Mather.xcodeproj \
            -scheme Mather \
            -destination "$SIM_DESTINATION" \
            -only-testing MatherTests \
            -skip-testing MatherUITests \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Run UI screenshot tests
        timeout-minutes: 15
        run: |
          mkdir -p ci-videos
          SIM_ID="${SIM_DESTINATION#id=}"

          # Record the simulator screen for the entire UI test run.
          # SIGINT (not SIGTERM) is required to finalize the MP4 container.
          xcrun simctl io "$SIM_ID" recordVideo --codec hevc \
            ci-videos/ui-tests.mp4 &
          VIDEO_PID=$!

          xcodebuild test-without-building \
            -project Mather.xcodeproj \
            -scheme Mather \
            -destination "$SIM_DESTINATION" \
            -only-testing MatherUITests \
            -resultBundlePath UITestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO
          XCODE_EXIT=$?

          kill -INT "$VIDEO_PID" && wait "$VIDEO_PID" 2>/dev/null || true
          exit $XCODE_EXIT

      - name: Extract screenshots from result bundle
        if: always()
        continue-on-error: true
        run: |
          mkdir -p ci-screenshots

          # Three-strategy extraction for Xcode 16.4:
          #   1. Read root object ID from Info.plist → xcresulttool get --id <root>
          #      (Xcode 16 requires an explicit ID; without it the output is empty)
          #   2. --legacy flag (restores pre-Xcode-16 _type JSON without --id)
          #   3. Direct magic-byte scan of Attachments/ dir (no extension on files)
          cat > /tmp/extract_screenshots.py << 'PYEOF'
          import sys, json, subprocess, pathlib, shutil, plistlib

          bundle = pathlib.Path("UITestResults.xcresult")
          out    = pathlib.Path("ci-screenshots")
          out.mkdir(exist_ok=True)

          if not bundle.exists():
              print("No UITestResults.xcresult — skipping")
              sys.exit(0)

          # Strategy 1 prep: read root object ID from Info.plist
          root_id = None
          info_path = bundle / "Info.plist"
          if info_path.exists():
              try:
                  info = plistlib.loads(info_path.read_bytes())
                  ref = info.get("rootObject", {})
                  root_id = (ref.get("id") or {}).get("_value") or ref.get("_value")
                  if root_id:
                      print(f"Root object ID from Info.plist: {root_id}")
              except Exception as e:
                  print(f"Info.plist read failed: {e}")

          # Build xcresulttool command candidates
          cmds = []
          if root_id:
              cmds.append(["xcrun", "xcresulttool", "get", "--path", str(bundle),
                           "--id", root_id, "--format", "json"])
          cmds += [
              ["xcrun", "xcresulttool", "get", "--path", str(bundle),
               "--format", "json", "--legacy"],
              ["xcrun", "xcresulttool", "get", "--path", str(bundle),
               "--format", "json"],
          ]

          raw = ""
          for cmd in cmds:
              res = subprocess.run(cmd, capture_output=True, text=True)
              raw = res.stdout.strip()
              if raw:
                  print(f"xcresulttool returned JSON (flags: {cmd[4:]})")
                  break

          extracted = 0
          if raw:
              try:
                  data = json.loads(raw)

                  def walk(node):
                      global extracted
                      if isinstance(node, dict):
                          if node.get("_type", {}).get("_name") == "ActionTestAttachment":
                              name   = node.get("name", {}).get("_value",
                                                                f"screenshot-{extracted:02d}")
                              ref_id = (node.get("payloadRef") or {}).get(
                                        "id", {}).get("_value")
                              if ref_id:
                                  dest = out / f"{name}.png"
                                  subprocess.run(
                                      ["xcrun", "xcresulttool", "export",
                                       "--path", str(bundle),
                                       "--id", ref_id,
                                       "--output-path", str(dest)],
                                      check=False, capture_output=True,
                                  )
                                  if dest.exists():
                                      print(f"  saved {dest.name}")
                                      extracted += 1
                          for v in node.values():
                              walk(v)
                      elif isinstance(node, list):
                          for item in node:
                              walk(item)

                  walk(data)
                  print(f"  {extracted} named screenshot(s) via xcresulttool JSON")
              except Exception as e:
                  print(f"JSON walk failed: {e}")
                  extracted = 0

          if extracted == 0:
              # Strategy 3: attachment files have no extension; detect by PNG magic bytes
              print("Falling back to direct attachment scan (no-extension files)")
              att_dir = bundle / "Attachments"
              if att_dir.exists():
                  idx = 0
                  for f in sorted(att_dir.iterdir()):
                      if not f.is_file():
                          continue
                      if f.read_bytes()[:4] == b'\x89PNG':
                          dest = out / f"screenshot-{idx:02d}.png"
                          shutil.copy(f, dest)
                          print(f"  {f.name} → {dest.name}")
                          idx += 1
                  if idx == 0:
                      print("  no PNG attachments found in Attachments/")
              else:
                  print(f"  Attachments/ not found in {bundle}")
          PYEOF

          python3 /tmp/extract_screenshots.py

          # Always capture a live simulator screenshot
          SIM_ID=$(xcrun simctl list devices booted \
            | grep -E '\([-A-F0-9]+\)' | head -1 \
            | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          if [[ -n "$SIM_ID" ]]; then
            xcrun simctl io "$SIM_ID" screenshot \
              ci-screenshots/simulator-final-state.png 2>/dev/null || true
          fi

          echo "--- Screenshot artifacts ---"
          find ci-screenshots -name "*.png" | sort | while read -r f; do
            SIZE=$(wc -c < "$f")
            echo "  $f (${SIZE} bytes)"
          done || echo "  (none)"

      - name: Upload test result bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: |
            TestResults.xcresult
            UITestResults.xcresult
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: ci-screenshots/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload UI test video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-video-${{ github.run_number }}
          path: ci-videos/
          if-no-files-found: ignore
          retention-days: 30
