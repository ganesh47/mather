name: TestFlight Crash Feedback Sync

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: testflight-crash-feedback-sync
  cancel-in-progress: false

jobs:
  sync-crash-feedback:
    name: Create issues for new TestFlight crash feedback
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Python dependencies
        run: pip3 install -r ci_scripts/testflight-feedback-requirements.txt

      - name: Sync TestFlight crash feedback into GitHub issues
        env:
          APP_STORE_CONNECT_APP_ID: ${{ secrets.APP_STORE_CONNECT_APP_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TESTFLIGHT_FEEDBACK_ONLY_KIND: crash
        run: python3 ci_scripts/testflight_feedback_to_issues.py
