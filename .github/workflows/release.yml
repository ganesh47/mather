name: Release

# Triggered when a tag like v1.2.3 is pushed.
# This workflow creates the GitHub Release and drives signed iOS and tvOS
# TestFlight delivery. Xcode Cloud creates the App Store-signed IPAs; the
# release job resolves the enabled archive workflow for each platform,
# retrieves both exports, uploads any build Xcode Cloud has not already
# distributed, and verifies both platforms reach internal testing.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to resume
        required: true
        type: string
      build_run_id:
        description: Existing Xcode Cloud build run ID to reuse (optional)
        required: false
        type: string

      existing_external_only:
        description: Assign this exact successful run to existing external groups and submit beta review (no build/upload)
        type: boolean
        default: false

      diagnostics_only:
        description: Inspect Xcode Cloud repository references without starting a build
        type: boolean
        default: false
      prepare_tag_only:
        description: Configure Xcode Cloud for this exact upcoming tag before pushing it
        type: boolean
        default: false
      fresh_build:
        description: Retry a failed archive with a fresh build of the same immutable tag
        type: boolean
        default: false
      restore_manual_tags:
        description: With preparation, restore an all-tag manual condition cleared by a prior update
        type: boolean
        default: false

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  github-release:
    name: Create GitHub Release
    if: ${{ !inputs.diagnostics_only && !inputs.prepare_tag_only && !inputs.existing_external_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: testflight-release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Parse version from tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          TAG="${RELEASE_TAG}"       # e.g. v1.0.0
          VERSION="${TAG#v}"         # e.g. 1.0.0
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.tag }} already exists, skipping create."
            exit 0
          fi

          gh release create "${{ steps.version.outputs.tag }}" \
            --title "Mather ${{ steps.version.outputs.tag }}" \
            --generate-notes \
            --notes-start-tag "$(git tag --sort=-version:refname | sed -n '2p')" \
            --notes "$(cat <<'EOF'
          ## Mather ${{ steps.version.outputs.tag }}

          iOS and tvOS TestFlight builds distributed automatically via Xcode Cloud.
          To sideload directly: clone this tag and open in Xcode → deploy to iPad via USB/WiFi.

          See the [commit history](https://github.com/${{ github.repository }}/commits/${{ steps.version.outputs.tag }}) for details.
          EOF
          )"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  apple-testflight:
    name: Publish iOS and tvOS to TestFlight
    if: ${{ !inputs.existing_external_only }}
    # API-only preparation/diagnostics do not need Xcode or a scarce Mac runner.
    runs-on: ${{ (inputs.prepare_tag_only || inputs.diagnostics_only) && 'ubuntu-latest' || 'macos-15' }}
    timeout-minutes: 80
    environment: testflight-release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Select Xcode
        if: ${{ !inputs.prepare_tag_only && !inputs.diagnostics_only }}
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install App Store Connect client dependencies
        run: |
          python3 -m venv .venv-testflight
          .venv-testflight/bin/pip install -r ci_scripts/testflight-feedback-requirements.txt

      - name: Build signed iOS and tvOS exports and publish to TestFlight
        env:
          APP_STORE_CONNECT_APP_ID: ${{ secrets.APP_STORE_CONNECT_APP_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          RESUME_BUILD_RUN_ID: ${{ inputs.build_run_id || '' }}
          DIAGNOSTICS_ONLY: ${{ inputs.diagnostics_only || false }}
          PREPARE_TAG_ONLY: ${{ inputs.prepare_tag_only || false }}
          FRESH_BUILD: ${{ inputs.fresh_build || false }}
          RESTORE_MANUAL_TAGS: ${{ inputs.restore_manual_tags || false }}
        run: |
          if [[ "${DIAGNOSTICS_ONLY}" == "true" ]]; then
            .venv-testflight/bin/python ci_scripts/xcode_cloud_diagnostics.py
            exit 0
          fi
          args=(
            --workflow-id "08111c64-7aa6-4651-b181-b86c25543bc5"
            --repository-id "3d717c8d-4c65-4f36-821b-94e10b4f639a"
            --tag "${RELEASE_TAG}"
            --platform all
          )
          if [[ "${PREPARE_TAG_ONLY}" == "true" ]]; then
            args+=(--prepare-tag-trigger)
          fi
          if [[ "${FRESH_BUILD}" == "true" ]]; then
            args+=(--force-new-build)
          fi
          if [[ "${RESTORE_MANUAL_TAGS}" == "true" ]]; then
            args+=(--restore-manual-tags)
          fi
          if [[ -n "${RESUME_BUILD_RUN_ID}" ]]; then
            args+=(--build-run-id "${RESUME_BUILD_RUN_ID}")
          fi
          .venv-testflight/bin/python ci_scripts/xcode_cloud_testflight.py "${args[@]}"

  existing-external:
    name: Distribute to existing external TestFlight groups
    if: ${{ inputs.existing_external_only && !inputs.diagnostics_only && !inputs.prepare_tag_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: testflight-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install App Store Connect client dependencies
        run: |
          python3 -m venv .venv-testflight
          .venv-testflight/bin/pip install -r ci_scripts/testflight-feedback-requirements.txt
      - name: Verify exact released builds and existing external distribution
        env:
          APP_STORE_CONNECT_APP_ID: ${{ secrets.APP_STORE_CONNECT_APP_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          RELEASE_TAG: ${{ inputs.tag }}
          RESUME_BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: .venv-testflight/bin/python ci_scripts/testflight_existing_external.py
