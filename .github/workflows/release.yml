name: Release

# Triggered when a tag like v1.2.3 is pushed.
# This job creates the GitHub Release entry with notes.
# The signed iOS and tvOS archives plus TestFlight distribution are handled by
# Xcode Cloud, which watches for tag changes matching v*.*.* independently.

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: testflight-release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Parse version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"   # e.g. v1.0.0
          VERSION="${TAG#v}"         # e.g. 1.0.0
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.tag }} already exists, skipping create."
            exit 0
          fi

          gh release create "${{ steps.version.outputs.tag }}" \
            --title "Mather ${{ steps.version.outputs.tag }}" \
            --generate-notes \
            --notes-start-tag "$(git tag --sort=-version:refname | sed -n '2p')" \
            --notes "$(cat <<'EOF'
          ## Mather ${{ steps.version.outputs.tag }}

          iOS and tvOS TestFlight builds distributed automatically via Xcode Cloud.
          To sideload directly: clone this tag and open in Xcode → deploy to iPad via USB/WiFi.

          See the [commit history](https://github.com/${{ github.repository }}/commits/${{ steps.version.outputs.tag }}) for details.
          EOF
          )"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
