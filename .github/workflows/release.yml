name: Release

# Triggered when a tag like v1.2.3 is pushed.
# This job creates the GitHub Release entry with notes.
# The actual iOS archive + TestFlight distribution is handled by
# Xcode Cloud, which watches for tag changes matching v*.*.* independently.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Parse version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"   # e.g. v1.0.0
          VERSION="${TAG#v}"         # e.g. 1.0.0
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "Mather ${{ steps.version.outputs.tag }}" \
            --generate-notes \
            --notes-start-tag "$(git tag --sort=-version:refname | sed -n '2p')" \
            --notes "$(cat <<'EOF'
          ## Mather ${{ steps.version.outputs.tag }}

          TestFlight build distributed automatically via Xcode Cloud.
          To sideload directly: clone this tag and open in Xcode → deploy to iPad via USB/WiFi.

          See the [commit history](https://github.com/${{ github.repository }}/commits/${{ steps.version.outputs.tag }}) for details.
          EOF
          )"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
