name: VS1 Milestone Progress Check

on:
  schedule:
    - cron: "0 17 * * 1"
  workflow_dispatch:

jobs:
  progress-check:
    name: Open/refresh VS1 progress check issue
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create weekly milestone check issue
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const trackingIssueNumber = 10;
            const labelEpic = "epic:vs1";
            const labelCheck = "type:checks";

            const now = new Date();
            const utcWeekStart = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()));
            utcWeekStart.setUTCDate(utcWeekStart.getUTCDate() - ((utcWeekStart.getUTCDay() + 6) % 7));
            const weeklyPrefix = `VS1-Make-&-Break-to-10`;
            const weekKey = utcWeekStart.toISOString().slice(0, 10);
            const title = `${weeklyPrefix} Progress Check - ${weekKey}`;

            const trackingIssue = await github.rest.issues.get({
              owner,
              repo,
              issue_number: trackingIssueNumber,
            });
            const milestone = trackingIssue.data.milestone;
            if (!milestone) {
              throw new Error(`Tracking issue #${trackingIssueNumber} is not attached to a milestone`);
            }

            const existing = await github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, state: "open", labels: `${labelEpic},${labelCheck}`, per_page: 100 }
            );
            const sameWeekOpen = existing.find((issue) => {
              const created = new Date(issue.created_at);
              return created >= utcWeekStart;
            });
            if (sameWeekOpen) {
              core.info(`Skipping: open progress issue already exists: ${sameWeekOpen.html_url}`);
              return;
            }

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, state: "all", milestone: milestone.number, per_page: 100 }
            );
            const openIssues = issues.filter((issue) => issue.state === "open");
            const closedIssues = issues.filter((issue) => issue.state === "closed");
            const highPriorityOpen = openIssues.filter((issue) =>
              issue.labels.some((label) => label.name === "priority:high")
            );
            const mediumPriorityOpen = openIssues.filter((issue) =>
              issue.labels.some((label) => label.name === "priority:medium")
            );

            const issueLines = (arr) => arr.map((issue) => `- #${issue.number} ${issue.title}`).join("\n");
            const body = `### VS1 Milestone Progress Check (${weekKey})

            - Milestone: ${milestone.title}
            - Total: ${issues.length}
            - Open: ${openIssues.length}
            - Closed: ${closedIssues.length}
            - High-priority open: ${highPriorityOpen.length}
            - Medium-priority open: ${mediumPriorityOpen.length}

            ### Open issues
            ${issueLines(openIssues).length > 0 ? issueLines(openIssues) : "- none"}

            ### High-priority open
            ${issueLines(highPriorityOpen).length > 0 ? issueLines(highPriorityOpen) : "- none"}

            ### Medium-priority open
            ${issueLines(mediumPriorityOpen).length > 0 ? issueLines(mediumPriorityOpen) : "- none"}

            ### Next actions
            1. Update open-item statuses in the VS1 milestone.
            2. Revisit risk escalations if high-priority blockers are still open after 2 weeks.
            3. Keep all VS1 sessions local-only in this alpha scope.`;

            await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              milestone: milestone.number,
              labels: [labelEpic, labelCheck],
            });
            core.info(`Created progress check issue: ${title}`);
