name: Bug Report
description: Something isn't working correctly
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: input
    id: ios_version
    attributes:
      label: iOS Version
      placeholder: "e.g. iOS 18.2"

  - type: input
    id: device
    attributes:
      label: Device / Simulator
      placeholder: "e.g. iPhone 16 Pro, iPhone 15 simulator"

  - type: textarea
    id: logs
    attributes:
      label: Crash Logs / Console Output
      render: text
